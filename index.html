<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業財務・株価分析ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full flex flex-col font-sans bg-slate-900 text-slate-100 antialiased pb-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg text-white shadow-md">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span id="headerCode" class="px-2 py-0.5 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">1717</span>
            <h1 id="headerName" class="text-base font-bold text-slate-100 leading-none">読み込み中...</h1>
          </div>
          <p class="text-[11px] text-slate-400 mt-1" id="headerSector">Googleスプレッドシート直接取得</p>
        </div>
      </div>

      <!-- 銘柄コード入力 -->
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400">銘柄コード:</span>
        <input type="text" id="stockInput" value="1717" class="w-20 bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg px-2 py-1.5 text-center focus:outline-none focus:border-cyan-500">
        <button onclick="searchStock()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium rounded-lg transition">表示</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- 2カラムグラフグリッド -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- EPS & BPS -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> EPS & BPS 推移
        </h3>
        <div class="h-64"><canvas id="epsBpsChart"></canvas></div>
      </div>

      <!-- 配当総額 -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-400"></i> 配当総額 推移
        </h3>
        <div class="h-64"><canvas id="dividendChart"></canvas></div>
      </div>

      <!-- 株価 & PBRバンド -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4 text-amber-400"></i> 株価 & PBRバンド
        </h3>
        <div class="h-64"><canvas id="pbrChart"></canvas></div>
      </div>

      <!-- 配当利回り -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-400"></i> 配当利回り 推移
        </h3>
        <div class="h-64"><canvas id="yieldChart"></canvas></div>
      </div>

    </div>
  </main>

  <script>
// ★「Webに公開」で生成されたURL（pubhtml）をそのまま貼り付けます
    const PUB_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsdWkBRiznMRDECkSsvS9KcUAQvWNAE5RJhxphdyCXPegEL_OooNR044c4mNVsws17d1MDIpPVwnIe/pub?output=csv";

    let charts = {};

    window.addEventListener('DOMContentLoaded', () => {
      loadDataFromSheet("1717");
    });

    function searchStock() {
      const code = document.getElementById('stockInput').value.trim();
      if(code) loadDataFromSheet(code);
    }

    async function loadDataFromSheet(targetCode) {
      try {
        // pubhtmlの末尾を pub?output=csv に変えて直接CSVを取得
        const response = await fetch(PUB_URL);
        if (!response.ok) throw new Error("CSVの取得に失敗しました。");
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const parsedData = {
          code: targetCode,
          name: "",
          sector: "",
          years: [],
          eps: [],
          bps: [],
          stockPrice: [],
          pbrLower: [],
          pbrUpper: [],
          pbrAvg: [],
          totalDividend: [],
          dividendYield: []
        };

        let found = false;

        // ヘッダーを除いて1行ずつ走査
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 10) continue;

          // A列（銘柄コード）の一致確認
          const rowCode = String(row[0]).trim();
          if (rowCode === String(targetCode)) {
            found = true;
            parsedData.name = row[1] || "該当銘柄";
            parsedData.sector = row[2] || "-";
            parsedData.years.push(row[3]);
            parsedData.eps.push(parseFloat(row[4]) || 0);
            parsedData.bps.push(parseFloat(row[5]) || 0);
            parsedData.stockPrice.push(parseFloat(row[7]) || 0);
            parsedData.pbrLower.push(parseFloat(row[8]) || 0);
            parsedData.pbrUpper.push(parseFloat(row[9]) || 0);
            parsedData.pbrAvg.push(parseFloat(row[10]) || 0);
            parsedData.totalDividend.push(parseFloat(row[11]) || 0);
            parsedData.dividendYield.push(parseFloat(row[12]) || 0);
          }
        }

        if (!found) {
          alert(`銘柄コード (${targetCode}) のデータが見つかりませんでした。スプレッドシートのA列にコードが入っているかご確認ください。`);
          return;
        }

        document.getElementById('headerCode').textContent = parsedData.code;
        document.getElementById('headerName').textContent = parsedData.name;
        document.getElementById('headerSector').textContent = parsedData.sector;

        renderCharts(parsedData);
      } catch (err) {
        console.error(err);
        alert("データの取得に失敗しました。URLと公開設定をご確認ください。");
      }
    }

    // CSV解析用関数
    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        return line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
      });
    }
  </script>
</body>
</html>
