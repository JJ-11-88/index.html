<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業財務・株価分析ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full flex flex-col font-sans bg-slate-900 text-slate-100 antialiased pb-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg text-white shadow-md">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span id="headerCode" class="px-2 py-0.5 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">1717</span>
            <h1 id="headerName" class="text-base font-bold text-slate-100 leading-none">読み込み中...</h1>
          </div>
          <p class="text-[11px] text-slate-400 mt-1" id="headerSector">スプレッドシート連携</p>
        </div>
      </div>

      <!-- 銘柄コード入力 -->
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400">銘柄コード:</span>
        <input type="text" id="stockInput" value="1717" class="w-20 bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg px-2 py-1.5 text-center focus:outline-none focus:border-cyan-500">
        <button onclick="searchStock()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium rounded-lg transition">表示</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- 2カラムグラフグリッド -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- EPS & BPS -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> EPS & BPS 推移
        </h3>
        <div class="h-64"><canvas id="epsBpsChart"></canvas></div>
      </div>

      <!-- 配当総額 -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-400"></i> 配当総額 推移
        </h3>
        <div class="h-64"><canvas id="dividendChart"></canvas></div>
      </div>

      <!-- 株価 & PBRバンド -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4 text-amber-400"></i> 株価 & PBRバンド
        </h3>
        <div class="h-64"><canvas id="pbrChart"></canvas></div>
      </div>

      <!-- 配当利回り -->
      <div class="bg-slate-800 border border-slate-700/80 p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-400"></i> 配当利回り 推移
        </h3>
        <div class="h-64"><canvas id="yieldChart"></canvas></div>
      </div>

    </div>
  </main>

  <script>
    // ★ ここにGoogle Apps ScriptのウェブアプリURLを貼り付け
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyS9i__oCceA5d_38j5n0UmdKbH9ZOuNHKY_ZzmowzJhZ9f7CFDxi-DB8eCHZi0-JxCRA/exec";

    let charts = {};

    window.addEventListener('DOMContentLoaded', () => {
      loadData("1717");
    });

    function searchStock() {
      const code = document.getElementById('stockInput').value.trim();
      if(code) loadData(code);
    }

    async function loadData(code) {
      try {
        const res = await fetch(`${GAS_API_URL}?code=${code}`);
        const data = await res.json();
        
        if (data.error) {
          alert(data.error);
          return;
        }

        document.getElementById('headerCode').textContent = data.code;
        document.getElementById('headerName').textContent = data.name;
        document.getElementById('headerSector').textContent = data.sector;

        renderCharts(data);
      } catch (err) {
        console.error(err);
        alert("データの取得に失敗しました。");
      }
    }

    function renderCharts(data) {
      const labels = data.years.map(y => `${y}期`);

      // 共通のグラフ描画ヘルパー
      function drawChart(id, config) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id).getContext('2d'), config);
      }

      // 1. EPS & BPS
      drawChart('epsBpsChart', {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: 'EPS (円)', data: data.eps, borderColor: '#06b6d4', backgroundColor: '#06b6d4', tension: 0.1 },
            { label: 'BPS (円)', data: data.bps, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.1 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } } }
      });

      // 2. 配当総額
      drawChart('dividendChart', {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: '配当総額', data: data.totalDividend, backgroundColor: '#10b981' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } } }
      });

      // 3. PBRバンド & 株価
      drawChart('pbrChart', {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { label: '株価', data: data.stockPrice, borderColor: '#f59e0b', borderWidth: 3, tension: 0.1 },
            { label: 'PBR上限', data: data.pbrUpper, borderColor: '#64748b', borderDash: [5,5], tension: 0.1 },
            { label: 'PBR平均', data: data.pbrAvg, borderColor: '#3b82f6', borderDash: [2,2], tension: 0.1 },
            { label: 'PBR下限', data: data.pbrLower, borderColor: '#64748b', borderDash: [5,5], tension: 0.1 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } } }
      });

      // 4. 配当利回り
      drawChart('yieldChart', {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{ label: '配当利回り', data: data.dividendYield, borderColor: '#6366f1', backgroundColor: '#6366f1', tension: 0.1 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } } }
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
