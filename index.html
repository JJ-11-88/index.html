<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>トヨタ自動車 (7203) BS・財務データ分析</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-900 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white pb-10">

  <!-- TOP STICKY HEADER -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg text-white shadow-md">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">7203</span>
            <h1 class="text-base font-bold text-slate-100 leading-none">トヨタ自動車株式会社</h1>
          </div>
          <p class="text-[11px] text-slate-400 mt-1">輸送用機器 | 単一銘柄 財務分析レポート</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- Overview Header Card -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-slate-100">トヨタ自動車 財務概要</h2>
        <p class="text-xs text-slate-400 mt-1" id="latestInfoText">直近決算期: 2025年3月期 | 直近10年データ（2016年〜2025年期）</p>
      </div>
      <div class="flex items-center gap-4 bg-slate-900/80 p-3 rounded-xl border border-slate-700/60 self-stretch md:self-auto justify-around">
        <div class="text-center md:text-right">
          <span class="block text-xs text-slate-400">自己資本比率 (最新)</span>
          <span class="text-lg font-extrabold text-cyan-400" id="latestEquityRatio">-%</span>
        </div>
        <div class="h-8 w-px bg-slate-700"></div>
        <div class="text-center md:text-right">
          <span class="block text-xs text-slate-400">当期純利益 (最新)</span>
          <span class="text-lg font-extrabold text-emerald-400" id="latestNetIncome">-</span>
        </div>
      </div>
    </div>

    <!-- Key KPI Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4" id="kpiGrid">
      <!-- Dynamic KPI Cards -->
    </div>

    <!-- Balance Sheet Visualizer Chart -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 md:p-6 shadow-lg space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <i data-lucide="layers" class="w-5 h-5 text-cyan-400"></i>
          <h2 class="text-base font-bold text-slate-100">BS (貸借対照表) 推移 & 構成比</h2>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <span class="text-slate-400">表示単位:</span>
          <button onclick="toggleAmountUnit('hundred_million')" id="unitBtn1" class="px-3 py-1 rounded-lg bg-cyan-600 text-white font-medium transition">億円</button>
          <button onclick="toggleAmountUnit('million')" id="unitBtn2" class="px-3 py-1 rounded-lg bg-slate-700 text-slate-300 transition">百万円</button>
        </div>
      </div>

      <div class="relative w-full overflow-x-auto custom-scroll pb-2">
        <div class="min-w-[650px] sm:min-w-full h-80">
          <canvas id="bsChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Financial Ratios Charts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 border border-slate-700/80 p-4 md:p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-cyan-400"></i>
          自己資本比率 (%) & ROE (%) 推移
        </h3>
        <div class="h-60">
          <canvas id="ratioChart1"></canvas>
        </div>
      </div>

      <div class="bg-slate-800 border border-slate-700/80 p-4 md:p-5 rounded-2xl shadow-lg space-y-3">
        <h3 class="text-xs md:text-sm font-semibold text-slate-200 flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
          流動比率 (%) & 固定比率 (%) 推移
        </h3>
        <div class="h-60">
          <canvas id="ratioChart2"></canvas>
        </div>
      </div>
    </div>

    <!-- Detailed Financial Table Accordion -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 md:p-6 shadow-lg space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm md:text-base font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="list-filter" class="w-5 h-5 text-cyan-400"></i>
          年別 財務詳細内訳
        </h3>
        <span class="text-xs text-slate-400">タップで詳細開閉</span>
      </div>

      <div id="bsDetailAccordion" class="space-y-2">
        <!-- Dynamic Accordion Content -->
      </div>
    </div>

  </main>

  <script>
    // TOYOTA MOTOR CORP (7203) 10-YEAR HISTORICAL DATA (2016 - 2025)
    const TOYOTA_DATA = {
      code: "7203",
      name: "トヨタ自動車",
      sector: "輸送用機器",
      years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025],
      currentAssets: [172000, 181000, 191000, 198000, 201000, 215000, 235000, 258000, 281000, 298000], // 億円
      fixedAssets:   [205000, 218000, 222000, 228000, 225000, 248000, 271000, 294000, 319000, 345000],
      currentLiab:   [138000, 142000, 148000, 152000, 158000, 169000, 185000, 201000, 218000, 232000],
      fixedLiab:     [124000, 131000, 135000, 141000, 139000, 151000, 168000, 182000, 195000, 210000],
      equity:        [115000, 126000, 130000, 133000, 129000, 143000, 153000, 169000, 187000, 201000],
      netIncome:     [23126,  18311,  24939,  18828,  20761,  22452,  28501,  24513,  49449,  47600]
    };

    let amountUnit = "hundred_million"; // 'hundred_million' or 'million'
    let bsChartInstance = null;
    let ratioChart1Instance = null;
    let ratioChart2Instance = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderAllView();
    });

    function toggleAmountUnit(unit) {
      amountUnit = unit;
      document.getElementById('unitBtn1').className = unit === 'hundred_million' ? "px-3 py-1 rounded-lg bg-cyan-600 text-white font-medium transition" : "px-3 py-1 rounded-lg bg-slate-700 text-slate-300 transition";
      document.getElementById('unitBtn2').className = unit === 'million' ? "px-3 py-1 rounded-lg bg-cyan-600 text-white font-medium transition" : "px-3 py-1 rounded-lg bg-slate-700 text-slate-300 transition";
      renderAllView();
    }

    function renderAllView() {
      const data = TOYOTA_DATA;
      const latestIdx = data.years.length - 1;
      const totalAssets = data.currentAssets[latestIdx] + data.fixedAssets[latestIdx];
      const equityRatio = ((data.equity[latestIdx] / totalAssets) * 100).toFixed(1);

      document.getElementById('latestInfoText').textContent = `直近決算期: ${data.years[latestIdx]}年3月期 | 総資産: ${formatValue(totalAssets)}`;
      document.getElementById('latestEquityRatio').textContent = `${equityRatio}%`;
      document.getElementById('latestNetIncome').textContent = formatValue(data.netIncome[latestIdx]);

      renderKPIGrid(data);
      renderBSChart(data);
      renderRatioCharts(data);
      renderBSAccordion(data);
    }

    function renderKPIGrid(data) {
      const idx = data.years.length - 1;
      const prevIdx = idx - 1;

      const totalAssets = data.currentAssets[idx] + data.fixedAssets[idx];
      const prevAssets = data.currentAssets[prevIdx] + data.fixedAssets[prevIdx];
      const assetsGrowth = (((totalAssets - prevAssets) / prevAssets) * 100).toFixed(1);

      const netIncomeGrowth = (((data.netIncome[idx] - data.netIncome[prevIdx]) / Math.abs(data.netIncome[prevIdx])) * 100).toFixed(1);
      const currentRatio = ((data.currentAssets[idx] / data.currentLiab[idx]) * 100).toFixed(1);
      const fixedRatio = ((data.fixedAssets[idx] / data.equity[idx]) * 100).toFixed(1);

      document.getElementById('kpiGrid').innerHTML = `
        <div class="bg-slate-800 border border-slate-700/80 p-4 rounded-xl shadow-sm">
          <span class="text-xs text-slate-400 block mb-1">総資産 (前年比)</span>
          <span class="text-base sm:text-lg font-bold text-slate-100">${formatValue(totalAssets)}</span>
          <span class="text-xs font-semibold ml-1 ${assetsGrowth >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
            ${assetsGrowth >= 0 ? '↑' : '↓'}${Math.abs(assetsGrowth)}%
          </span>
        </div>

        <div class="bg-slate-800 border border-slate-700/80 p-4 rounded-xl shadow-sm">
          <span class="text-xs text-slate-400 block mb-1">当期純利益 (前年比)</span>
          <span class="text-base sm:text-lg font-bold text-slate-100">${formatValue(data.netIncome[idx])}</span>
          <span class="text-xs font-semibold ml-1 ${netIncomeGrowth >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
            ${netIncomeGrowth >= 0 ? '↑' : '↓'}${Math.abs(netIncomeGrowth)}%
          </span>
        </div>

        <div class="bg-slate-800 border border-slate-700/80 p-4 rounded-xl shadow-sm">
          <span class="text-xs text-slate-400 block mb-1">流動比率 (短期安全性)</span>
          <span class="text-base sm:text-lg font-bold text-cyan-400">${currentRatio}%</span>
          <span class="text-[10px] text-slate-400 block mt-0.5">目安: 100%以上</span>
        </div>

        <div class="bg-slate-800 border border-slate-700/80 p-4 rounded-xl shadow-sm">
          <span class="text-xs text-slate-400 block mb-1">固定比率 (長期安全性)</span>
          <span class="text-base sm:text-lg font-bold text-indigo-400">${fixedRatio}%</span>
          <span class="text-[10px] text-slate-400 block mt-0.5">目安: 100%以下</span>
        </div>
      `;
    }

    function renderBSChart(data) {
      const ctx = document.getElementById('bsChart').getContext('2d');
      if (bsChartInstance) bsChartInstance.destroy();

      const mult = amountUnit === 'million' ? 100 : 1;

      bsChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.years.map(y => `${y}期`),
          datasets: [
            {
              label: '流動資産',
              data: data.currentAssets.map(v => v * mult),
              backgroundColor: '#06b6d4',
              stack: 'Stack 0',
            },
            {
              label: '固定資産',
              data: data.fixedAssets.map(v => v * mult),
              backgroundColor: '#3b82f6',
              stack: 'Stack 0',
            },
            {
              label: '流動負債',
              data: data.currentLiab.map(v => v * mult),
              backgroundColor: '#f43f5e',
              stack: 'Stack 1',
            },
            {
              label: '固定負債',
              data: data.fixedLiab.map(v => v * mult),
              backgroundColor: '#fb7185',
              stack: 'Stack 1',
            },
            {
              label: '純資産 (自己資本)',
              data: data.equity.map(v => v * mult),
              backgroundColor: '#10b981',
              stack: 'Stack 1',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 12 }
            },
            tooltip: {
              callbacks: {
                label: (context) => `${context.dataset.label}: ${context.raw.toLocaleString()} ${amountUnit === 'million' ? '百万円' : '億円'}`
              }
            }
          },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function renderRatioCharts(data) {
      const ctx1 = document.getElementById('ratioChart1').getContext('2d');
      if (ratioChart1Instance) ratioChart1Instance.destroy();

      ratioChart1Instance = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: data.years.map(y => `${y}期`),
          datasets: [
            {
              label: '自己資本比率 (%)',
              data: data.years.map((y, i) => ((data.equity[i] / (data.currentAssets[i] + data.fixedAssets[i])) * 100).toFixed(1)),
              borderColor: '#06b6d4',
              backgroundColor: '#06b6d4',
              tension: 0.2
            },
            {
              label: 'ROE (%)',
              data: data.years.map((y, i) => ((data.netIncome[i] / data.equity[i]) * 100).toFixed(1)),
              borderColor: '#10b981',
              backgroundColor: '#10b981',
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } }
          }
        }
      });

      const ctx2 = document.getElementById('ratioChart2').getContext('2d');
      if (ratioChart2Instance) ratioChart2Instance.destroy();

      ratioChart2Instance = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: data.years.map(y => `${y}期`),
          datasets: [
            {
              label: '流動比率 (%)',
              data: data.years.map((y, i) => ((data.currentAssets[i] / data.currentLiab[i]) * 100).toFixed(1)),
              backgroundColor: '#3b82f6',
            },
            {
              label: '固定比率 (%)',
              data: data.years.map((y, i) => ((data.fixedAssets[i] / data.equity[i]) * 100).toFixed(1)),
              backgroundColor: '#f43f5e',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function renderBSAccordion(data) {
      const container = document.getElementById('bsDetailAccordion');
      container.innerHTML = data.years.slice().reverse().map((year, revIdx) => {
        const idx = data.years.length - 1 - revIdx;
        const curA = data.currentAssets[idx];
        const fixA = data.fixedAssets[idx];
        const curL = data.currentLiab[idx];
        const fixL = data.fixedLiab[idx];
        const eq = data.equity[idx];
        const total = curA + fixA;

        return `
          <div class="border border-slate-700/60 rounded-xl overflow-hidden bg-slate-900/40">
            <button onclick="toggleAccordion('acc-${year}')" class="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-slate-800/50 transition">
              <div class="flex items-center gap-3">
                <span class="font-bold text-sm text-cyan-400">${year}年3月期</span>
                <span class="text-xs text-slate-400">総資産: ${formatValue(total)} | 純利益: ${formatValue(data.netIncome[idx])}</span>
              </div>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </button>
            <div id="acc-${year}" class="hidden p-4 border-t border-slate-700/50 bg-slate-900/80 text-xs md:text-sm space-y-3">
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                  <span class="block font-semibold text-cyan-400 border-b border-cyan-500/20 pb-1">資産の部</span>
                  <div class="flex justify-between text-slate-300"><span>流動資産:</span> <span>${formatValue(curA)}</span></div>
                  <div class="flex justify-between text-slate-300"><span>固定資産:</span> <span>${formatValue(fixA)}</span></div>
                  <div class="flex justify-between font-bold text-slate-100 border-t border-slate-700 pt-1"><span>資産合計:</span> <span>${formatValue(total)}</span></div>
                </div>
                <div class="space-y-1.5">
                  <span class="block font-semibold text-rose-400 border-b border-rose-500/20 pb-1">負債・純資産の部</span>
                  <div class="flex justify-between text-slate-300"><span>流動負債:</span> <span>${formatValue(curL)}</span></div>
                  <div class="flex justify-between text-slate-300"><span>固定負債:</span> <span>${formatValue(fixL)}</span></div>
                  <div class="flex justify-between text-emerald-400"><span>純資産:</span> <span>${formatValue(eq)}</span></div>
                  <div class="flex justify-between font-bold text-slate-100 border-t border-slate-700 pt-1"><span>負債純資産計:</span> <span>${formatValue(curL + fixL + eq)}</span></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    function formatValue(valInHundredMillion) {
      if (amountUnit === 'million') {
        return (valInHundredMillion * 100).toLocaleString() + '百万円';
      }
      return valInHundredMillion.toLocaleString() + '億円';
    }
  </script>
</body>
</html>
